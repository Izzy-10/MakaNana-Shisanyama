@media print{body::before{display:none}}
h1,h2,h3{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.02em;margin:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
header{text-align:center;padding:28px 0 12px}
.brand{font:400 15px Barlow;letter-spacing:.35em;color:var(--mute)}
.logo{font-family:Georgia,serif;font-size:40px;line-height:1}
h1{font-size:54px;line-height:.95;margin-top:14px}
h1 em{color:var(--gold);font-style:italic}
.open{display:inline-block;margin-top:12px;padding:6px 14px;border:1px solid var(--gold);border-radius:99px;font-weight:600;color:var(--gold)}
.open.closed{border-color:var(--red);color:#ff7a80}
.rules{background:var(--red);padding:12px 14px;margin:16px 0;border-radius:6px;font-weight:600}
.rules b{font-family:'Bebas Neue',Impact;font-size:22px;font-weight:400;display:block;letter-spacing:.03em}
.rules span{font-weight:400;font-size:14px;opacity:.95}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{flex:none;background:none;color:var(--text);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font:600 15px Barlow;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--gold);color:#000;border-color:var(--gold)}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.item h3{font-size:24px}
.item p{margin:2px 0 0;color:var(--mute);font-size:14px}
.price{color:var(--gold);font-weight:700;margin-top:4px}
.qty{display:flex;align-items:center;gap:10px;flex:none}
.qty button,.add{background:var(--gold);color:#000;border:0;border-radius:8px;font:700 16px Barlow;min-width:40px;height:40px;cursor:pointer;padding:0 14px}
.qty button.minus{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.promo{border:1px dashed var(--gold);border-radius:8px;padding:10px 12px;margin-bottom:14px;color:var(--gold);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:10}
.bar button{display:flex;justify-content:space-between;width:100%;max-width:640px;margin:0 auto;background:var(--gold);color:#000;border:0;border-radius:10px;padding:15px 18px;font:700 18px Barlow;cursor:pointer}
.bar button:disabled{background:#3a3226;color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--card);border-top:2px solid var(--gold);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92%;overflow:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.panel h2{font-size:34px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.row.tot{border:0;font-weight:700;font-size:19px;color:var(--gold)}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px;color:var(--mute)}
input,select,textarea{width:100%;background:#0d0a08;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:400 16px Barlow}
.pay{display:flex;gap:8px;margin-top:6px}
.pay label{flex:1;margin:0;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;color:var(--text);cursor:pointer}
.pay input{display:none}
.pay input:checked+span{color:var(--gold);font-weight:700}
.pay label:has(input:checked){border-color:var(--gold)}
.go{width:100%;margin-top:18px;background:var(--gold);color:#000;border:0;border-radius:10px;padding:15px;font:700 18px Barlow;cursor:pointer}
.ghost{background:none;color:var(--text);border:1px solid var(--line);margin-top:8px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.err{color:#ff7a80;font-size:14px;min-height:20px;margin-top:8px}
.steps{list-style:none;padding:0;margin:14px 0}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;color:var(--mute)}
.steps li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.done{color:var(--text)}
.steps li.done i{background:var(--gold);border-color:var(--gold)}
.steps li.now{color:var(--gold);font-weight:700}
.steps li.now i{border-color:var(--gold);animation:p 1.2s infinite}
@keyframes p{50%{box-shadow:0 0 0 6px rgba(232,163,23,.25)}}
@media(prefers-reduced-motion:reduce){.steps li.now i{animation:none}}
[hidden]{display:none!important}
.big{font-size:20px;margin:6px 0 10px;color:var(--gold)}
.big b{font:400 64px/1 'Bebas Neue',Impact,sans-serif;margin-right:10px;color:#fff}
.acts button.pr{background:transparent;color:var(--text);border:1px solid var(--line)}
#ticket{display:none}
@media print{html,body{background:#fff!important;background-image:none!important}body>*:not(#ticket){display:none!important}#ticket{display:block!important;color:#000;padding:8px;font-family:monospace}}
